<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background styling -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Route glow -->
    <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Water gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Dark Base Map -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- City Blocks / Building Zones -->
  <g fill="#1e293b" opacity="0.6">
    <rect x="50" y="40" width="160" height="110" rx="8"/>
    <rect x="250" y="40" width="220" height="110" rx="8"/>
    <rect x="510" y="40" width="180" height="180" rx="8"/>
    <rect x="730" y="40" width="200" height="120" rx="8"/>
    <rect x="970" y="40" width="180" height="160" rx="8"/>

    <rect x="50" y="190" width="180" height="140" rx="8"/>
    <rect x="270" y="190" width="200" height="140" rx="8"/>
    <rect x="730" y="200" width="160" height="150" rx="8"/>
    <rect x="930" y="240" width="220" height="140" rx="8"/>

    <rect x="50" y="370" width="140" height="160" rx="8"/>
    <rect x="230" y="370" width="220" height="160" rx="8"/>
    <rect x="490" y="260" width="200" height="270" rx="8"/>
    <rect x="730" y="390" width="180" height="160" rx="8"/>
    <rect x="950" y="420" width="200" height="180" rx="8"/>

    <rect x="50" y="570" width="240" height="90" rx="8"/>
    <rect x="330" y="570" width="220" height="90" rx="8"/>
    <rect x="590" y="570" width="260" height="90" rx="8"/>
    <rect x="890" y="630" width="260" height="50" rx="8"/>
  </g>

  <!-- Parks / Green Spaces -->
  <g fill="#065f46" opacity="0.25">
    <rect x="730" y="40" width="200" height="120" rx="8"/>
    <rect x="230" y="370" width="220" height="160" rx="8"/>
  </g>

  <!-- River / Water Body -->
  <path d="M 0 540 C 300 500, 600 620, 1200 480 L 1200 560 C 600 700, 300 580, 0 620 Z" fill="url(#waterGrad)"/>

  <!-- Minor City Streets (Gray) -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    
    <line x1="230" y1="0" x2="230" y2="700"/>
    <line x1="480" y1="0" x2="480" y2="700"/>
    <line x1="710" y1="0" x2="710" y2="700"/>
    <line x1="940" y1="0" x2="940" y2="700"/>
  </g>

  <!-- Major Expressways / Arterial Roads (Lighter Gray) -->
  <g stroke="#475569" stroke-width="8" stroke-linecap="round">
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="460" x2="1200" y2="460"/>
    <line x1="370" y1="0" x2="370" y2="700"/>
    <line x1="830" y1="0" x2="830" y2="700"/>
  </g>

  <!-- Active Uber GPS Route (Glowing Neon Blue/Cyan) -->
  <g filter="url(#routeGlow)">
    <path d="M 180 460 
             L 370 460 
             L 370 230 
             L 830 230 
             L 830 350 
             L 1020 350" 
          stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Route Inner Line (Bright Core) -->
  <path d="M 180 460 
           L 370 460 
           L 370 230 
           L 830 230 
           L 830 350 
           L 1020 350" 
        stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Direction Arrows on Route -->
  <polygon points="460,225 475,230 460,235" fill="#06b6d4"/>
  <polygon points="650,225 665,230 650,235" fill="#06b6d4"/>
  <polygon points="825,290 830,305 835,290" fill="#06b6d4"/>

  <!-- Start Point (A) - Green Pulse -->
  <circle cx="180" cy="460" r="18" fill="#10b981" opacity="0.3"/>
  <circle cx="180" cy="460" r="10" fill="#10b981"/>
  <circle cx="180" cy="460" r="4" fill="#ffffff"/>

  <!-- Destination Point (B) - Red Pulse -->
  <circle cx="1020" cy="350" r="22" fill="#ef4444" opacity="0.3"/>
  <circle cx="1020" cy="350" r="12" fill="#ef4444"/>
  <text x="1020" y="354" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">B</text>

  <!-- Uber Driver Car Location on Route -->
  <g transform="translate(600, 215)">
    <!-- Car Pulse Ring -->
    <circle cx="15" cy="15" r="24" fill="#06b6d4" opacity="0.2"/>
    <!-- Car Dot / Heading Marker -->
    <circle cx="15" cy="15" r="14" fill="#000000" stroke="#06b6d4" stroke-width="2.5"/>
    <polygon points="15,6 20,20 15,16 10,20" fill="#ffffff"/>
  </g>

  <!-- Street Names Overlay -->
  <g fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" opacity="0.8">
    <text x="100" y="222">GRAND TRUNK EXPRESSWAY</text>
    <text x="500" y="222">PARK STREET MAIN AVE</text>
    <text x="385" y="100" transform="rotate(90, 385, 100)">AIRPORT LINK RD</text>
    <text x="845" y="100" transform="rotate(90, 845, 100)">BYPASS HIGHWAY</text>
    <text x="750" y="452">MG ROAD SOUTH</text>
  </g>

  <!-- GPS Online Badge (Top Right) -->
  <g transform="translate(1040, 25)">
    <rect width="130" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="34" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">GPS ONLINE</text>
  </g>
</svg>

